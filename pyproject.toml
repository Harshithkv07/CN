[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hrt-agent"
version = "1.0.0"
description = "HRT-Agent: Hybrid RAG-Telemetry Architecture for Autonomous SOC Automation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Group 9, Amrita Vishwa Vidyapeetham" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "pyod>=2.0",
    "joblib>=1.4",
    "chromadb>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "docker>=7.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hrt = "hrt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hrt = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]
