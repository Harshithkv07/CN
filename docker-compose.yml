
services:
  victim-server:
    image: nginx:alpine
    networks:
      - hrt-net

  zeek-sensor:
    image: blacktop/zeek:latest
    cap_add:
      - NET_ADMIN
    network_mode: "service:victim-server"
    working_dir: /usr/local/zeek/logs
    command: -i eth0 -C local
    volumes:
      - ./telemetry/logs:/usr/local/zeek/logs
      - ./telemetry/config/json-logs.zeek:/usr/local/zeek/share/zeek/site/local.zeek

networks:
  hrt-net:
    driver: bridge
